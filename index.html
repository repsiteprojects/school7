<!DOCTYPE html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML: Web-бет жасау</title>
<style>
:root{--bg:#0a0c10;--p:#10141a;--p2:#161b22;--ln:#232a34;--ink:#e6edf3;--mut:#8b949e;--ac:#3ddc97;--bl:#79b8ff;--wn:#f2cc60;--bd:#ff7b72;
--mono:ui-monospace,"JetBrains Mono","Fira Code",SFMono-Regular,Consolas,Menlo,monospace;
--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg) radial-gradient(#171c24 1px,transparent 1px) 0 0/24px 24px;color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:800px;margin:auto;padding:28px 16px 96px}
h1{font:700 28px/1.2 var(--sans);letter-spacing:-.02em;margin:.2em 0 .3em}
h2{font:650 21px/1.3 var(--sans);letter-spacing:-.01em;margin:.5em 0 .6em}
h3{font:600 17px var(--sans);margin:.1em 0 .6em}
p{margin:.5em 0}
.ac{color:var(--ac)}.m{color:var(--mut)}.y{color:var(--ac)}.n{color:var(--bd)}
.lab{font:12px var(--mono);color:var(--ac);letter-spacing:.04em;margin-bottom:8px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:20px;margin:16px 0}
.btn{font:500 14px var(--sans);background:var(--p2);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:9px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--mut)}
.btn.pri{background:var(--ac);color:#04130c;border-color:var(--ac);font-weight:600}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
code{font:13.5px var(--mono);background:#1a2029;color:var(--bl);padding:2px 6px;border-radius:5px;border:1px solid #232a34}
.hook{border-left:3px solid var(--ac);background:#0f1a16;padding:12px 14px;border-radius:0 8px 8px 0;color:#cfeee1}
/* menu */
.prog-top{height:4px;background:var(--ln);border-radius:4px;overflow:hidden;margin:14px 0 18px}.prog-top i{display:block;height:100%;background:var(--ac)}
.it{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin:8px 0;color:var(--ink);cursor:pointer;font:500 15px var(--sans);transition:border-color .15s,transform .15s}
.it:hover{border-color:var(--ac);transform:translateX(2px)}
.it .no{font:600 14px var(--mono);color:var(--ac)}.it .st{font:12px var(--mono);color:var(--mut)}.it.dn .st{color:var(--ac)}
/* editor */
.ed,.pv{border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin:10px 0;background:#0d1117}
.tabbar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--p2);border-bottom:1px solid var(--ln);font:12px var(--mono);color:var(--mut)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:#30363d}
.lkb{margin-left:auto;color:var(--wn)}
textarea{display:block;width:100%;height:190px;resize:vertical;border:0;background:transparent;color:#dbe4ee;font:14px/1.6 var(--mono);padding:12px;tab-size:2}
textarea:focus{outline:none;background:#0f141b}textarea.lk{opacity:.75;cursor:not-allowed}
iframe{display:block;width:100%;height:160px;border:0;background:#fff}
input[type=text]{background:#0d1117;color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;font:14px var(--sans);width:100%;max-width:340px}
input[type=text]:disabled{opacity:.6}
label{font:500 13px var(--mono);color:var(--mut);display:block}
.term{background:#0d1117;border:1px solid var(--ln);border-radius:8px;padding:10px 14px;font:13.5px/1.8 var(--mono);margin:10px 0}
.term .sc{border-top:1px dashed var(--ln);margin-top:6px;padding-top:6px;color:var(--wn)}
.opt button{margin-right:6px}.opt .on{border-color:var(--ac);background:#0f1a16;color:var(--ac)}
/* games */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.col{display:flex;flex-direction:column;gap:8px}
.tile{font:500 14px var(--sans);background:var(--p2);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.tile.sel{border-color:var(--wn);color:var(--wn)}.tile.ok{border-color:var(--ac);color:var(--ac);background:#0f1a16}.tile.bad{border-color:var(--bd);color:var(--bd)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{position:relative;height:74px;border:1px solid var(--ln);border-radius:8px;background:var(--p2);color:var(--ink);cursor:pointer;font:500 13px/1.3 var(--sans);padding:4px}
.mc .ft{display:none}.mc .bk{font:600 16px var(--mono);color:#3a4350}
.mc.up .ft,.mc.ok .ft{display:inline}.mc.up .bk,.mc.ok .bk{display:none}
.mc.up{border-color:var(--wn)}.mc.ok{border-color:var(--ac);background:#0f1a16;color:var(--ac)}
.prog{font:12px var(--mono);color:var(--mut)}
.stmt{font-size:18px;margin:.6em 0}
.asm{min-height:50px;background:#0d1117;border:1px solid var(--ln);border-radius:8px;padding:12px;font:15px/1.6 var(--mono);color:#dbe4ee;white-space:pre-wrap;margin:8px 0}
.tok{font:500 14px var(--mono);background:var(--p2);color:var(--bl);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;cursor:pointer}
.tok.bad{border-color:var(--bd);color:var(--bd)}.tok:disabled{opacity:.35}
.blank{color:var(--wn);border-bottom:2px dashed var(--wn)}.blank.fill{color:var(--ac);border-bottom-color:var(--ac)}
.vs{display:grid;gap:8px;margin:12px 0}
.vr{display:grid;gap:4px;text-align:left;background:var(--p2);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;cursor:pointer;font:14.5px/1.5 var(--sans);transition:border-color .15s}
.vr b{font:600 13px var(--mono);color:var(--ac)}.vr span{color:var(--ink)}
.vr:hover:not(:disabled){border-color:var(--ac)}
.vr.on{border-color:var(--ac);background:#0f1a16}.vr:disabled:not(.on){opacity:.4;cursor:not-allowed}.vr:disabled:not(.on) b::after{content:' 🔒';color:var(--wn)}
.vsel{font:12.5px var(--mono);color:var(--mut);margin:0 0 8px}.vsel b{color:var(--ac)}
.qr{display:flex;align-items:center;gap:16px;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:14px 0}
.qr img{width:128px;height:128px;background:#fff;padding:8px;border-radius:8px;flex:none;object-fit:contain}
.qr p{margin:0}.qr .m{font-size:13.5px}
.qr img{cursor:zoom-in}
#qrbig{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.92);display:grid;place-items:center;align-content:center;gap:14px;cursor:zoom-out;padding:12px}
#qrbig img{width:min(92vw,92vh,900px);height:min(92vw,92vh,900px);background:#fff;padding:3vmin;border-radius:12px;object-fit:contain}
#qrbig span{font:13px var(--mono);color:var(--mut)}
@media(max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}h1{font-size:23px}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style></head><body><main id="app"></main>
<script>
/* DevTools-ты ашатын пернелер мен тінтуір мәзірін бұғаттау */
document.addEventListener('contextmenu',ev=>ev.preventDefault());
document.addEventListener('keydown',ev=>{const c=ev.code;
 if(c==='F12'||((ev.ctrlKey||ev.metaKey)&&ev.shiftKey&&(c==='KeyI'||c==='KeyJ'||c==='KeyC'))||((ev.ctrlKey||ev.metaKey)&&c==='KeyU')||(ev.metaKey&&ev.altKey&&(c==='KeyI'||c==='KeyJ'||c==='KeyC'||c==='KeyU'))){ev.preventDefault();ev.stopPropagation()}},true);

const URL_="https://script.google.com/macros/s/AKfycbxLJ81_48AEYmHHl5wj1qOMZXCc4C2cR9TyTXUNJ9mYqcPIiMkUvPBq29FDdrOI2v13/exec";

const QR_IMG="qr.png";
const TPL='<html>\n<head><title></title></head>\n<body>\n\n</body>\n</html>';
const L=[
{n:34,t:"HTML-дағы мәтін және тізімдер",
 g:{k:'match',name:'Жұптастыру',txt:"Алдыңғы тақырыпты (Web-бағдарламалау) еске түсір: терминді анықтамасымен жұптастыр. Сол жақтан таңда, оң жақтан жұбын тап.",
  d:[["WWW","Дүниежүзілік өрмек"],["Web-сайт","Гиперсілтемемен байланысқан Web-беттер жиынтығы"],["HTML","Гипермәтінді белгілеу тілі"],["front-end","Көрсету компоненті"]]},
 hook:"🏠 HTML — Web-беттің қаңқасы. Үй салғандай: алдымен қабырға мен бөлмелер (құрылым), содан кейін өрнек.",
 lec:["**HTML** (HyperText Markup Language) — қатаң ережелері бар компьютерлік тіл. Құжат `<html>` тегімен басталып, `</html>` тегімен аяқталады. Файл кеңейтілімі `.htm` немесе `.html`. Файлды Блокнотта жазуға болады.","Тегтер `<` және `>` белгілерінің ішінде жазылады. Көбінің жұбы бар: ашылатын `<p>` және жабылатын `</p>` (жабылатын тег `/` белгісімен басталады).","**Құрылымы:** `<head>` ішіндегі `<title>` — бет тақырыбы; `<body>` ішінде — негізгі мәтін.","**Тақырыптар:** алты деңгей `<h1>` … `<h6>`. Абзац — `<p>`, жаңа жол — `<br>`, көлденең сызық — `<hr>`.","**Мәтін форматы:** қалың `<b>` немесе `<strong>`, курсив `<i>`, төменгі индекс `<sub>`, жоғарғы индекс `<sup>`.","**Тізімдер:** маркерленген `<ul>`, нөмірленген `<ol>`, элемент `<li>`. Нөмір түрі: `<ol type=\"A\">`, бастапқы нөмір: `<ol start=\"3\">`."],
 demo:'<h2>Компьютер жады</h2>\n<ul>\n<li>Ішкі жад\n<ol><li>Жедел жад</li><li>Тұрақты жад</li></ol></li>\n<li>Сыртқы жад</li>\n</ul>\n<p>H<sub>2</sub>O, <b>қалың</b>, <i>курсив</i></p>',
 task:"«Менің мектебім» бетін жаз: тақырып, абзац, екі түрлі тізім және форматталған мәтін.",
 chk:[["<title> жазылған",d=>d.title.trim().length>0],["Тақырып <h1>–<h3>","h1,h2,h3"],["Абзац <p>","p"],["<ul> ішінде кемінде 3 <li>","ul>li",3],["<ol> ішінде кемінде 3 <li>","ol>li",3],["Қалың мәтін <b> немесе <strong>","b,strong"],["Курсив <i>","i,em"]],
 rf:[{q:"Тақырыпты қаншалықты түсіндің?",k:"s"},{q:"Бүгін не жаңа үйрендім?",k:"t"}]},
{n:35,t:"Мультимедиа және сілтемелер",
 g:{k:'memory',name:'Жад карталары',txt:"Өткен сабақтағы тегті мағынасымен жұптастыр: екі карта аш, жұбын тапсаң — ашық қалады.",
  d:[["<h1>","Тақырып"],["<p>","Абзац"],["<ul>","Маркерленген тізім"],["<ol>","Нөмірленген тізім"],["<br>","Жаңа жол"],["<hr>","Көлденең сызық"]]},
 hook:"🚪 Сілтеме — интернеттегі есік: бассаң, басқа бөлмеге түсесің. Сурет — бөлменің терезесі.",
 lec:["**Сурет:** `<img src=\"Astana.jpg\">`. `src` (source — көзі) атрибуты сурет мекенжайын береді. Сурет файлы HTML файлымен бір бумада болуы керек. Форматтар: GIF, JPG, PNG.","**Атрибуттар:** `alt` — сурет көрінбесе жазылатын мәтін; `width`, `height` — өлшемі; `border` — жақтау; `align` — орналасуы.","Мысал: `<img src=\"tu.png\" alt=\"Қазақстан туы\" width=\"140\" height=\"90\">`","**Гиперсілтеме** — басқа бетке өтетін сөз немесе сурет. Тег — `<a>` (anchor), мекенжай — `href` атрибутында: `<a href=\"http://kk.wikipedia.org\">Уикипедия</a>`.","**Сурет-сілтеме:** `<a href=\"comp.html\"><img src=\"comp.jpg\"></a>` — суретке басқанда `comp.html` ашылады.","**Мультимедиа:** аудио `<audio controls src=\"ән.mp3\"></audio>`, бейне `<video controls src=\"фильм.mp4\"></video>`."],
 demo:'<p><a href="https://kk.wikipedia.org">Уикипедияға өту</a></p>\n<img src="жоқ.png" alt="Сурет табылмаса осы мәтін көрінеді" width="120">\n<br><audio controls></audio>',
 task:"Сурет, сурет-сілтеме, сыртқы сілтеме және аудио/бейне қосылған бет жаса.",
 chk:[["<img> src атрибутымен","img[src]"],["alt атрибуты","img[alt]"],["width немесе height","img[width],img[height]"],["Сыртқы сілтеме (href=\"http...\")","a[href^=http]"],["Сурет-сілтеме: <a> ішінде <img>","a img"],["<audio controls> немесе <video controls>","audio[controls],video[controls]"]],
 rf:[{q:"Бүгін 3 жаңа термин:",k:"t"},{q:"2 қызықты факт:",k:"t"},{q:"1 сұрағым:",k:"t"}]},
{n:36,t:"Web-бетке мультимедиалық контент қосу және навигацияны ұйымдастыру",
 g:{k:'tf',name:'Ақиқат / Жалған',txt:"Өткен сабақтағы сурет пен сілтеме туралы пікірлерді тексер. Дұрыс жауап бермейінше келесіге өтпейсің.",
  d:[["`src` атрибуты сурет мекенжайын көрсетеді.",true,""],["`alt` — суреттің өлшемін беретін атрибут.",false,"`alt` — сурет көрінбесе жазылатын мәтін."],["Гиперсілтеме жасау үшін `<a>` тегі қолданылады.",true,""],["Сілтеме мекенжайы `src` атрибутында беріледі.",false,"Сілтеме мекенжайы `href` атрибутында беріледі."],["`<audio controls>` дыбысты басқару панелін көрсетеді.",true,""],["Суретті сілтеме етуге болмайды.",false,"`<a>` ішіне `<img>` қойсаң, сурет сілтемеге айналады."]]},
 hook:"🗺️ Навигация — сайттың картасы. Мәзір жоқ сайтта адам адасады.",
 lec:["**Бетке өту:** толық мекенжай қажет емес. Бір бумада тұрса: `<a href=\"2_bet.html\">`. Басқа бумада: `<a href=\"website/2_bet.html\">`.","**Бет ішіндегі сілтеме:** элементке `id` береміз: `<h1 id=\"heading1\">`, сілтеме — `<a href=\"#heading1\">`. `#` браузерге сілтеме осы беттің ішінде екенін айтады.","**Мәзір:** бірнеше `<a>` тегін қатарға қоямыз: Басты бет | Біз туралы | Байланыс.","**Сілтеме түсі** `<body>` тегінде беріледі: `link` — қаралмаған, `vlink` — қаралған, `alink` — басылып тұрған. Мысал: `<body link=\"#669900\" vlink=\"#666666\" alink=\"#000000\">`.","**Фондық сурет:** `<body background=\"fon.jpg\">` — сурет бет бойына қайталанып төселеді."],
 demo:'<body link="#2457ff" vlink="#888888">\n<p><a href="#a">1-бөлім</a> | <a href="#b">2-бөлім</a> | <a href="2_bet.html">Келесі бет</a></p>\n<div style="height:200px"></div>\n<h3 id="a">1-бөлім</h3><div style="height:200px"></div>\n<h3 id="b">2-бөлім</h3>',
 task:"Мәзірі бар бет жаса: .html беттерге сілтемелер, бет ішіндегі сілтеме және сілтеме түстері.",
 chk:[["Кемінде 2 сілтеме .html файлға","a[href$='.html']",2],["Мәзірде кемінде 3 сілтеме","a",3],["Бет ішіндегі сілтеме href=\"#...\"","a[href^='#']"],["Сілтеме көрсететін id бар",d=>[...d.querySelectorAll("a[href^='#']")].some(a=>d.getElementById(a.getAttribute('href').slice(1)))],["<body> тегінде link/vlink/alink","body[link],body[vlink],body[alink]"]],
 rf:[{q:"Тақырыпты түсіндім:",k:"c",o:["🟢 толық","🟡 ішінара","🔴 түсінбедім"]},{q:"Қай жері қиын болды?",k:"t"}]},
{n:37,t:"HTML-дағы кесте",
 g:{k:'order',name:'Кодты жина',txt:"Өткен сабақтағы навигация кодын жина: бөлшектерді дұрыс ретпен бас.",
  d:[{h:"Бет ішіндегі сілтеме",t:['<a',' href=','"#heading1"','>','Бастау','</a>']},{h:"Сілтеме көрсететін элемент",t:['<h1',' id=','"heading1"','>']},{h:"Сілтеме түстері",t:['<body',' link=','"#669900"',' vlink=','"#666666"','>']}]},
 hook:"📒 Кесте — сынып журналы сияқты: қатарлар мен бағандар, әр ұяшықта өз мәні.",
 lec:["Кесте `<table>` … `</table>` тегтерімен жасалады. Ішінде: `<tr>` — қатар, `<td>` — қатардағы ұяшық, `<th>` — баған немесе қатар тақырыбы, `<caption>` — кестенің атауы.","**Құрылым:** `<table>` ішінде `<tr>`, `<tr>` ішінде `<td>`/`<th>`. Қатар саны — `<tr>` саны, баған саны — қатардағы ұяшық саны.","**Атрибуттар:** `border` — шегара қалыңдығы (пиксель), `width` — ені (пиксель немесе %), `cellpadding` — мән мен шегара арақашықтығы, `cellspacing` — ұяшықтар арақашықтығы, `align` — туралау, `bgcolor` — фон түсі.","Мысал: `<table border=\"1\" width=\"60%\">` — шегарасы 1 пиксель, ені бет енінің 60%."],
 demo:'<table border="1" cellpadding="6">\n<caption>Сабақ кестесі</caption>\n<tr><th>Күн</th><th>Пән</th></tr>\n<tr><td>Дүйсенбі</td><td>Информатика</td></tr>\n<tr><td>Сейсенбі</td><td>Математика</td></tr>\n</table>',

 function apply(k){t.value=k.code;t.readOnly=true;t.classList.add('lk');up();$('#tk').disabled=true;$('#lkb').hidden=false;
  $('#tr').innerHTML=`<div class="term">${show(k.r)}<div class="sc">score: ${k.sc} / 10</div></div>`;
  if(k.sent){$('#fin').hidden=false;$('#fin').innerHTML=`<p class="y">✔ Жіберілді${k.fio?': '+e(k.fio):''}. Балл: ${k.sc}/10.</p><div class="row">${L[i+1]?`<button class="btn pri" onclick="openL(${i+1})">Келесі сабақ →</button>`:''}<button class="btn" onclick="menu()">Мәзір</button></div>`}
  else $('#fin').hidden=false}
 if(lk)apply(lk);
 $('#tk').onclick=()=>{if(!confirm('Тексергеннен кейін кодты өзгерту мүмкін болмайды. Жалғастырасыз ба?'))return;
  const code=t.value,r=run(x,code),sc=Math.round(r.filter(y=>y[1]).length/r.length*10),k={code,r,sc,sent:0,v};
  saveLock(l.n,k);apply(k);go('#tr')};
 $('#td').onclick=()=>{if(!$('#fio'))return;const f=$('#fio').value.trim();if(f.split(/\s+/).length<2){alert('ФИО толық жазыңыз (тегі мен аты)');return}
  const k=getLock(l.n);$('#td').disabled=true;$('#fio').disabled=true;refl(l,i,f,k)};
 if(!lk)go('#s3')}
function refl(l,i,fio,k){const A={};
 $('#s4').innerHTML=`<div class="card"><div class="lab">// 04 · рефлексия</div>${l.rf.map((f,j)=>`<p><b>${e(f.q)}</b></p>`+(f.k==='t'?`<div class="ed"><textarea data-j="${j}" style="height:70px"></textarea></div>`:`<div class="opt" data-j="${j}">${(f.o||[1,2,3,4,5].map(x=>['😞','😕','😐','🙂','🤩'][x-1])).map(o=>`<button class="btn">${e(o)}</button>`).join('')}</div>`)).join('')}<div class="row"><button class="btn pri" id="sd">Жіберу</button><span id="st" class="m" style="align-self:center"></span></div></div>`;
 document.querySelectorAll('.opt').forEach(o=>o.querySelectorAll('button').forEach(b=>b.onclick=()=>{o.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');A[o.dataset.j]=b.textContent}));
 $('#sd').onclick=async()=>{document.querySelectorAll('#s4 textarea').forEach(t=>A[t.dataset.j]=t.value.trim());
  if(l.rf.some((_,j)=>!A[j])){$('#st').textContent='Барлық сұраққа жауап бер';return}
  const refl={};l.rf.forEach((f,j)=>refl[f.q]=A[j]);$('#sd').disabled=true;$('#st').textContent='Жіберілуде…';
  try{await fetch(URL_,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({n:l.n,t:l.t+' · '+((k.v||0)+1)+'-нұсқа',fio,score:k.sc,code:k.code,reflection:refl})});
   saveLock(l.n,{...k,sent:1,fio});
   $('#s4').innerHTML=`<div class="card"><div class="lab">// дайын</div><h3>🎉 Рақмет, ${e(fio)}!</h3><p>Нәтижең мұғалімге жіберілді. Балл: ${k.sc}/10.</p><div class="row">${L[i+1]?`<button class="btn pri" onclick="openL(${i+1})">Келесі сабақ →</button>`:''}<button class="btn" onclick="menu()">Мәзір</button></div></div>`}
  catch(x){$('#sd').disabled=false;$('#st').textContent='Қате: интернетті тексеріп, қайта жіберіңіз'}}}
menu();
</script></body></html>
